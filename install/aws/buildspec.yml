#
# AWS CodeBuild build: compiles the image in the cloud, pushes it to ECR, then tells the
# EC2 instance to roll onto it via SSM Run Command. No SSH key is needed in the cloud.
#
# The project-level environment variables ECR_REPO, INSTANCE_ID, THUNDERID_DOMAIN and
# GITHUB_REPO are set by provision-codebuild.sh.

version: 0.2

phases:
  pre_build:
    commands:
      - REGISTRY=${ECR_REPO%%/*}
      - TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-9)
      - IMAGE="${ECR_REPO}:${TAG}"
      - echo "Building ${IMAGE}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - docker build -t "$IMAGE" -t "${ECR_REPO}:latest" .

  post_build:
    commands:
      - docker push "$IMAGE"
      - docker push "${ECR_REPO}:latest"
      # Refresh the instance's copy of install/aws from the exact commit that was built, so the
      # Compose file and config templates never drift from the image.
      - |
        DEPLOY_SCRIPT=$(cat <<SH
        set -euo pipefail
        mkdir -p /home/ec2-user/thunderid
        cd /home/ec2-user/thunderid
        curl -fsSL "https://codeload.github.com/${GITHUB_REPO}/tar.gz/${CODEBUILD_RESOLVED_SOURCE_VERSION}" \
          | tar -xz --strip-components=3 --wildcards '*/install/aws/*'
        chmod +x render.sh
        THUNDERID_DOMAIN='${THUNDERID_DOMAIN}' THUNDERID_IMAGE='${IMAGE}' ./render.sh
        aws ecr get-login-password --region '${AWS_DEFAULT_REGION}' \
          | docker login --username AWS --password-stdin '${REGISTRY}'
        docker compose pull
        docker compose up -d --remove-orphans
        SH
        )
        CMD_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "Deploy ${TAG}" \
          --parameters "commands=[\"runuser -l ec2-user -c '$(echo "$DEPLOY_SCRIPT" | sed "s/'/'\\\\''/g" | tr '\n' ';')'\"]" \
          --query Command.CommandId --output text)
        echo "SSM command ${CMD_ID} sent to ${INSTANCE_ID}, waiting"
        for i in $(seq 1 60); do
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || break
          sleep 10
        done
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
          --query 'StandardOutputContent' --output text
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
          --query 'StandardErrorContent' --output text
        echo "Deploy status: ${STATUS}"
        [ "$STATUS" = "Success" ]
      - echo "Deployed ${TAG} to https://${THUNDERID_DOMAIN}"

cache:
  paths:
    - '/root/.cache/go-build/**/*'
    - '/root/.local/share/pnpm/store/**/*'
