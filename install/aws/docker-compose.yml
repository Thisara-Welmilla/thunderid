# ThunderID on a single AWS EC2 instance, behind Caddy for automatic Let's Encrypt TLS.
# Values come from the .env file written by render.sh.

services:
  # Initialize database from the image. Uses "cp -rn" so an existing database is never
  # overwritten on redeploy.
  thunderid-db-init:
    image: ${THUNDERID_IMAGE}
    command: sh -c "cp -rn /opt/thunderid/database/* /data/"
    volumes:
      - thunderid-db:/data
    restart: "no"

  # Run setup once, ever. Compose recreates this container whenever the image or this file
  # changes, and a second setup.sh run rotates the generated admin password, so the sentinel
  # in the database volume makes repeat runs a no-op.
  thunderid-setup:
    image: ${THUNDERID_IMAGE}
    command: >
      sh -c 'if [ -f /opt/thunderid/database/.thunderid-setup-complete ]; then
               echo "Setup already completed, skipping. Delete database/.thunderid-setup-complete to force it.";
             else
               ./setup.sh && touch /opt/thunderid/database/.thunderid-setup-complete;
             fi'
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Per-deployment TLS/JWT-signing/AES key material generated by setup.sh, shared with the server.
      - thunderid-certs:/opt/thunderid/config/certs
      # Direct Auth Secret generated by setup.sh, shared with the server.
      - thunderid-secrets:/opt/thunderid/config/secrets
      # Setup starts a temporary server, so it needs the same public URL as the server.
      - ./rendered/deployment.yaml:/opt/thunderid/deployment.yaml:ro
    depends_on:
      thunderid-db-init:
        condition: service_completed_successfully
    restart: "no"

  # ThunderID server. Not published on the host; Caddy is the only way in.
  thunderid:
    image: ${THUNDERID_IMAGE}
    depends_on:
      thunderid-setup:
        condition: service_completed_successfully
    expose:
      - "8090"
    volumes:
      - thunderid-db:/opt/thunderid/database
      - thunderid-certs:/opt/thunderid/config/certs:ro
      - thunderid-secrets:/opt/thunderid/config/secrets:ro
      - ./rendered/deployment.yaml:/opt/thunderid/deployment.yaml:ro
      # The Console and Gate config.js files are deliberately NOT overridden. They default
      # to the origin they are served from, which is already correct behind Caddy, and
      # replacing them drops the brand, documentation, and scope defaults the image ships.
      - ./rendered/cors.yaml:/opt/thunderid/config/resources/server_configs/cors.yaml:ro
    restart: unless-stopped

  # TLS termination and Let's Encrypt certificate management
  caddy:
    image: caddy:2-alpine
    depends_on:
      - thunderid
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./rendered/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  thunderid-db:
    driver: local
  thunderid-certs:
    driver: local
  thunderid-secrets:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
